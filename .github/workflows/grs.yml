name: Update README cards

on:
  schedule:
    # Daily at 03:17 UTC
    - cron: "17 3 * * *"
  # Bootstrap the cards on the first push of this workflow
  push:
    paths:
      - ".github/workflows/grs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=iuu6&show_icons=true&icon_color=CE1D2D&hide_title=true&theme=default&include_all_commits=true"
          path: profile/stats-light.svg
          # STATS_TOKEN is a classic PAT with `repo` + `read:user` scopes.
          # Without it the cards still render, but only public repositories are counted.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=iuu6&show_icons=true&icon_color=CE1D2D&hide_title=true&theme=dark&include_all_commits=true"
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=iuu6&layout=compact&theme=default"
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=iuu6&layout=compact&theme=dark"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
